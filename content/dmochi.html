/* ╚═════════════ AKHIR CONFIG — JANGAN EDIT DI BAWAH SINI ═════════════ */

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

};
const PLATFORMS=CONFIG.PLATFORMS.map((p,i)=>Object.assign({},p,PLATCOLOR[p.id]||PALETTE[i%PALETTE.length]));
const PMAP={};PLATFORMS.forEach(p=>PMAP[p.id]=p);

/* ================= DATABASE ================= */
const KEY='dompetmochi.v1';
let DB;
function loadData(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  DB=Object.assign({tx:[],initBal:{},salary:{},bills:{},targets:{}},d||{});
  DB.tx=DB.tx||[];
  DB.initBal=DB.initBal||{};
  PLATFORMS.forEach(p=>{if(DB.initBal[p.id]==null)DB.initBal[p.id]=0;});
  DB.salary=Object.assign({},DB.salary);
  DB.salary.tama=Object.assign({merah:0,weekend:0,comp:[]},DB.salary.tama||{});
  DB.salary.septi=Object.assign({merah:0,weekend:0,comp:[]},DB.salary.septi||{});
  DB.bills=Object.assign({},DB.bills);
  DB.bills.tama=DB.bills.tama||[];
  DB.bills.septi=DB.bills.septi||[];
  DB.targets=DB.targets||{};
  save();
}
/* === SERVER SYNC (Turso via /api/state) === */
let _saveT=null,_ready=false,_dirty=false;
const APP_API='/api/state';
const _getAppKey=()=>{
  try{
    if(window.parent&&window.parent.location&&window.parent.location.search){
      const m=new URLSearchParams(window.parent.location.search).get('key');
      if(m){
        try{localStorage.setItem('dmochi.key',m)}catch(e){}
        try{window.parent.history.replaceState({},'',window.parent.location.pathname)}catch(e){}
        return m;
      }
    }
  }catch(e){}
  try{return localStorage.getItem('dmochi.key')||''}catch(e){return ''}
};
const _setAppKey=k=>{try{localStorage.setItem('dmochi.key',k)}catch(e){}};
const _postState=()=>{
  try{
    const k=_getAppKey();
    setSyncStatus('syncing');
    fetch(APP_API,{method:'POST',headers:{'Content-Type':'application/json','x-app-key':k},body:JSON.stringify({data:DB})})
      .then(r=>{r.ok?setSyncStatus('ok'):setSyncStatus('err','POST '+r.status)})
      .catch(e=>setSyncStatus('err',String(e&&e.message||e)));
  }catch(e){setSyncStatus('err',String(e&&e.message||e))}
};
const save=()=>{
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
  if(!_ready){_dirty=true;return}
  if(_saveT)clearTimeout(_saveT);
  _saveT=setTimeout(_postState,400);
};
const syncFromServer=async()=>{
  try{
    setSyncStatus('syncing');
    let k=_getAppKey();
    let r=await fetch(APP_API,{headers:{'x-app-key':k}});
    if(r.status===401){
      k=prompt('Masukkan kunci akses Dompet Mochi:')||'';
      if(!k){_ready=true;return}
      _setAppKey(k);
      r=await fetch(APP_API,{headers:{'x-app-key':k}});
    }
    if(!r.ok){_ready=true;setSyncStatus('err','GET '+r.status+' (cek env Turso)');return}
    const j=await r.json();
    const srv=j&&j.data;
    if(srv){
      const s=JSON.stringify(srv);
      if(s!==JSON.stringify(DB)){
        localStorage.setItem(KEY,s);
        Object.assign(DB,{tx:[],initBal:{},salary:{},bills:{},targets:{}},srv);
        DB.tx=DB.tx||[];
        DB.initBal=DB.initBal||{};
        PLATFORMS.forEach(p=>{if(DB.initBal[p.id]==null)DB.initBal[p.id]=0});
        DB.salary.tama=Object.assign({merah:0,weekend:0,comp:[]},DB.salary.tama||{});
        DB.salary.septi=Object.assign({merah:0,weekend:0,comp:[]},DB.salary.septi||{});
        DB.bills.tama=DB.bills.tama||[];
        DB.bills.septi=DB.bills.septi||[];
        DB.targets=DB.targets||{};
        renderAll();
      }
      setSyncStatus('ok');
      _ready=true;
      if(_dirty){_dirty=false;if(_saveT)clearTimeout(_saveT);_saveT=setTimeout(_postState,400)}
    }else{
      _ready=true;_postState();
    }
  }catch(e){_ready=true;setSyncStatus('err',String(e&&e.message||e))}
};
/* === SYNC STATUS BADGE (biar gagal sync gak senyap lagi) === */
let SYNC_BADGE=null;
function setSyncStatus(state,msg){
  try{
    if(!SYNC_BADGE){
      SYNC_BADGE=document.createElement('div');
      SYNC_BADGE.id='dmochiSyncBadge';
      SYNC_BADGE.style.cssText='position:fixed;top:6px;right:6px;z-index:99999;font:600 10px/1.4 Nunito,sans-serif;color:#fff;background:#94a3b8;padding:3px 7px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:none;opacity:.95;letter-spacing:.2px;transition:background .25s';
      (document.body||document.documentElement).appendChild(SYNC_BADGE);
    }
    const map={syncing:['#f59e0b','⏳ Sync…'],ok:['#22c55e','☁️ Tersinkron'],err:['#ef4444','☁️ Offline']};
    const m=map[state]||['#94a3b8','☁️ …'];
    SYNC_BADGE.style.background=m[0];
    SYNC_BADGE.textContent=m[1];
    SYNC_BADGE.title=msg?((state==='err'?'Sinkronisasi gagal: ':'')+msg):'';
  }catch(e){}
}
setSyncStatus('syncing');

/* ================= STATE UI ================= */
const NOW=new Date();
const st={tab:'home',y:NOW.getFullYear(),m:NOW.getMonth(),salTab:'tama',billTab:'tama',platId:null,editComp:null,editBill:null,editTgt:null};
const monthKey=()=>st.y+'-'+pad(st.m+1);
const monthLabel=()=>MONTHS[st.m]+' '+st.y;
const mTx=()=>DB.tx.filter(t=>t.date.slice(0,7)===monthKey()).sort((a,b)=>b.date.localeCompare(a.date));
const timeOf=d=>(d||'').slice(11,16);
function fmtDay(ds){
  const[y,m,d]=ds.split('-').map(Number);
  return DAYS[new Date(y,m-1,d).getDay()]+', '+d+' '+MONTHS[m-1]+' '+y;
}

/* ================= HITUNG ================= */
function balances(){
  const b={};PLATFORMS.forEach(p=>b[p.id]=DB.initBal[p.id]||0);
  DB.tx.forEach(t=>{
    if(t.type==='trf'){if(b[t.from]!=null)b[t.from]-=t.amount;if(b[t.to]!=null)b[t.to]+=t.amount;}
    else if(t.type==='in'){if(b[t.platform]!=null)b[t.platform]+=t.amount;}
    else{if(b[t.platform]!=null)b[t.platform]-=t.amount;}
  });
  return b;
}
function mStats(list){
  let i=0,o=0;list.forEach(t=>{if(t.type==='in')i+=t.amount;else if(t.type==='out')o+=t.amount;});
  return{i,o,net:i-o};
}
function salCalc(p){
  const S=DB.salary[p],R=RATES[p]||{};
  const comp=S.comp.reduce((a,k)=>a+k.amount,0);
  let lembur=0;
  Object.keys(R).forEach(k=>{lembur+=(S[k]||0)*(R[k]||0);});
  const total=comp+lembur;
  const bills=DB.bills[p];
  const billSum=bills.reduce((a,b)=>a+b.amount,0);
  const paidCount=bills.filter(b=>b.paid).length;
  const pots=POTD[p]||[];
  const potSum=pots.reduce((a,x)=>a+x[1],0);
  const afterBill=total-billSum,afterPot=total-potSum;
  let bca=0,isaku=0,splitNote='';
  if(afterPot>=ISAKU_SETORAN){isaku=ISAKU_SETORAN;bca=afterPot-ISAKU_SETORAN;}
  else if(afterPot>0){isaku=afterPot;splitNote='Sisanya belum cukup buat setoran ISAKU penuh '+fmt(ISAKU_SETORAN)+'.';}
  else{splitNote='After '+pots.map(x=>x[0]).join(' & ')+' masih minus, belum bisa dipecah ya.';}
  return{comp,lembur,total,billSum,paidCount,nBills:bills.length,pots,afterBill,afterPot,bca,isaku,splitNote};
}

/* ================= TOAST & CONFETTI ================= */
function toast(m){
  const t=document.createElement('div');t.className='toast';t.textContent=m;
  $('#toasts').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('on'));
  setTimeout(()=>{t.classList.remove('on');setTimeout(()=>t.remove(),300);},2400);
}
const warnToast=m=>toast('⚠️ '+m);
const cvs=$('#cfx'),ctx=cvs.getContext('2d');
let parts=[],craf=null;
function sizeC(){cvs.width=innerWidth;cvs.height=innerHeight;}
addEventListener('resize',sizeC);sizeC();
function confetti(n){
  n=n||80;
  const C=['#FF8FAB','#FFC94D','#5BC49A','#6EB5E3','#F26D6D','#E06FB4'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.3,
    vx:(Math.random()-.5)*8,vy:-(Math.random()*9+4),g:.3,s:5+Math.random()*6,
    r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:C[i%C.length],life:0,max:80+Math.random()*40});
  if(!craf)craf=requestAnimationFrame(stepC);
}
function stepC(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(p=>p.life<p.max);
  if(!parts.length){craf=null;return;}
  parts.forEach(p=>{
    p.life++;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
    ctx.globalAlpha=Math.max(0,1-p.life/p.max);ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.65);ctx.restore();
  });
  craf=requestAnimationFrame(stepC);
}

/* ================= SHEET ================= */
let sheetBD=null;
function openSheet(html){
  closeSheet();
  const bd=document.createElement('div');bd.className='sheetbd';
  bd.innerHTML='<div class="sheet">'+html+'</div>';
  document.body.appendChild(bd);
  document.body.style.overflow='hidden';
  bd.addEventListener('click',e=>{if(e.target===bd)closeSheet();});
  requestAnimationFrame(()=>bd.classList.add('on'));
  sheetBD=bd;
}
function closeSheet(){
  if(!sheetBD)return;
  const b=sheetBD;sheetBD=null;
  b.classList.remove('on');
  document.body.style.overflow='';
  setTimeout(()=>b.remove(),250);
}
A.close=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
function askConfirm(title,msg,okLabel,fn){

  }
  openSheet('<form class="frm" onsubmit="return A.saveTx(event,\''+kind+'\',\''+(editId||'')+'\')">'
    +'<div class="sh-head"><span style="font-size:24px">'+head[0]+'</span><b>'+head[1]+'</b>'
    +'<button type="button" class="xbtn" onclick="A.close()">✕</button></div>'
    +core
    +'<div class="drow"><div><label>Tanggal</label><input type="date" class="inl" id="fDate" value="'+d+'"></div>'
    +'<div><label>Jam</label><input type="time" class="inl" id="fTime" value="'+tm+'"></div></div>'
    +'<label>Keterangan <em>(opsional)</em></label>'
    +'<textarea class="inl" id="fNote" rows="2" placeholder="Tulis catatan kecil di sini…">'+(ed?esc(ed.note||''):'')+'</textarea>'
    +'<div class="crow"><button type="button" class="btn" onclick="A.close()">Batal</button>'
    +'<button class="btn pink" type="submit">'+(ed?'Simpan Perubahan':'Simpan')+'</button></div></form>');
  A.prevCheck();
};
A.prevCheck=()=>{
  const el=document.getElementById('saldoPrev');if(!el)return;
  const id=selChip('from');
  if(!id||!PMAP[id]){el.textContent='Pilih platform asal dulu ya';return;}
  const bal=balances()[id];
  const amt=parseNum((document.getElementById('fAmt')||{}).value);
  el.innerHTML='Saldo '+esc(PMAP[id].name)+': <b>'+fmt(bal)+'</b>'
    +(amt>bal?' <span class="warn">· melebihi saldo!</span>':'');
};
A.saveTx=(e,kind,editId)=>{
  e.preventDefault();
  const amt=parseNum(document.getElementById('fAmt').value);
  const d=document.getElementById('fDate').value;
  const tm=document.getElementById('fTime').value||'00:00';
  const note=(document.getElementById('fNote').value||'').trim();
  if(!amt)return warnToast('Nominalnya diisi dulu ya');
  if(!d)return warnToast('Tanggalnya diisi ya');
  let tx;
  if(kind==='trf'){
    const f=selChip('from'),t=selChip('to');
    if(!f||!t)return warnToast('Pilih platform asal & tujuan dulu ya');
    if(f===t)return warnToast('Platform asal & tujuan nggak boleh sama');
    if(amt>balances()[f])return warnToast('Saldo '+(PMAP[f]||{}).name+' cuma '+fmt(balances()[f]));
    tx={id:editId||uid(),type:'trf',amount:amt,from:f,to:t,date:d+'T'+tm,note};
  }else{
    const title=(document.getElementById('fTitle').value||'').trim();
    const p=selChip('plat');
    const cBtn=document.querySelector('.chip.on[data-g="cat"]');
    const cat=cBtn?cBtn.dataset.n:null;
    if(!title)return warnToast('Judulnya diisi dulu ya');
    if(!p)return warnToast('Pilih platformnya dulu');
    if(!cat)return warnToast('Pilih kategorinya dulu');
    tx={id:editId||uid(),type:kind,title,amount:amt,platform:p,cat,date:d+'T'+tm,note};
  }
  if(editId)DB.tx=DB.tx.map(t=>t.id===editId?tx:t);else DB.tx.push(tx);
  save();closeSheet();renderAll();
  toast(editId?'Transaksi diperbarui ✨':kind==='in'?'Pemasukan tercatat! 💰':kind==='out'?'Pengeluaran tercatat! 💸':'Transfer berhasil! 🔁');
  if(kind==='in'&&!editId)confetti(70);
  return false;
};

  const lemburs=Object.keys(RATES[p]||{}).map(k=>
    lembHTML(p,k,LEMBUR_LABEL[k]||('Lembur '+k),RATES[p][k],S[k]||0)).join('');
  const potRows=c.pots.map(x=>'<div class="eqrow dn"><span>− '+esc(x[0])+'</span><span>−'+fmt(x[1])+'</span></div>').join('');
  const neg1=c.afterBill<0,neg2=c.afterPot<0;
  /* rincian sisa gaji after tagihan (ISAKU selalu tetap) */
  let splitBill='';
  if(p==='septi'){
    const t2=c.afterBill;
    let b2=0,i2=0,note2='';
    if(t2>=ISAKU_SETORAN){i2=ISAKU_SETORAN;b2=t2-ISAKU_SETORAN;}
    else if(t2>0){i2=t2;note2='Sisanya belum cukup buat setoran ISAKU penuh '+fmt(ISAKU_SETORAN)+'.';}
    else{note2='After tagihan masih minus, belum bisa dipecah ya.';}
    const bp2=t2>0?b2/t2*100:0,ip2=t2>0?i2/t2*100:0;
    splitBill='<div class="card eqcard"><div class="eqlab">🪄 Rincian Sisa Gaji After Tagihan</div>'
      +(t2>0
        ?'<div class="splitbar"><i style="width:'+bp2+'%;background:#5D9DE0"></i><i style="width:'+ip2+'%;background:#F27BA0"></i></div>'
         +'<div class="eqrow"><span><span class="dotc" style="background:#5D9DE0"></span>Saldo BCA</span><span class="num sm">'+fmt(b2)+'</span></div>'
         +'<div class="eqrow"><span><span class="dotc" style="background:#F27BA0"></span>ISAKU</span><span class="num sm">'+fmt(i2)+'</span></div>'
         +'<p class="eqnote">ISAKU selalu '+fmt(ISAKU_SETORAN)+', sisanya masuk Saldo BCA.</p>'
        :'<p class="emptyline">'+note2+'</p>')
      +'</div>';
  }
  /* rincian gaji after potongan (BPJS dll) */
  let split='';
  if(p==='septi'){
    const tot=c.afterPot;
    const bp=tot>0?c.bca/tot*100:0,ip=tot>0?c.isaku/tot*100:0;
    split='<div class="card eqcard"><div class="eqlab">🪄 Rincian Gaji After '+esc(potLabel)+'</div>'
      +(tot>0
        ?'<div class="splitbar"><i style="width:'+bp+'%;background:#5D9DE0"></i><i style="width:'+ip+'%;background:#F27BA0"></i></div>'
         +'<div class="eqrow"><span><span class="dotc" style="background:#5D9DE0"></span>Saldo BCA</span><span class="num sm">'+fmt(c.bca)+'</span></div>'
         +'<div class="eqrow"><span><span class="dotc" style="background:#F27BA0"></span>ISAKU</span><span class="num sm">'+fmt(c.isaku)+'</span></div>'
         +'<p class="eqnote">ISAKU selalu '+fmt(ISAKU_SETORAN)+', sisanya masuk Saldo BCA.</p>'
        :'<p class="emptyline">'+c.splitNote+'</p>')+'</div>';
  }
  return '<div class="card eqcard"><span class="tape"></span>'
    +'<div class="eqlab">📋 Komponen Gaji '+P+'</div>'
    +compRows
    +'<div class="addrow"><input class="inl" id="cn_'+p+'" placeholder="Nama komponen">'
    +'<input class="inl" id="ca_'+p+'" inputmode="numeric" placeholder="Nominal" oninput="A.fmtAmt(this)">'
    +'<button class="mini ok" onclick="A.compAdd(\''+p+'\')">＋</button></div></div>'
    +'<div class="card eqcard"><div class="eqlab">⏰ Lembur</div>'+lemburs
    +'<p class="eqnote">Tap ＋ buat nambah 1 hari lembur, tap − buat batal.</p></div>'
    +'<div class="card totalcard"><div class="hlab">Total Gaji '+P+'</div>'
    +'<div class="num xl" style="margin-top:2px">'+fmt(c.total)+'</div>'
    +'<div class="eqnote">komponen '+fmt(c.comp)+' + lembur '+fmt(c.lembur)+'</div></div>'
    +'<div class="card eqcard"><div class="eqlab">🧾 '+(p==='tama'?'Gaji':'Sisa Gaji')+' After Tagihan</div>'
    +'<div class="eqrow"><span>Total gaji</span><span>'+fmt(c.total)+'</span></div>'
    +'<div class="eqrow dn"><span>− Total tagihan '+P+'</span><span>−'+fmt(c.billSum)+'</span></div>'
    +'<div class="eqdiv"></div>'
    +'<div class="eqrow tot"><span>Sisa</span><span class="num md '+(neg1?'dn':'')+'">'+fmt(c.afterBill)+'</span></div>'
    +'<p class="eqnote">'+c.paidCount+'/'+c.nBills+' tagihan udah lunas · dihitung dari semua tagihan di segmen Tagihan</p></div>'
    +splitBill
    +'<div class="card eqcard"><div class="eqlab">🛡️ '+(p==='tama'?'Gaji':'Sisa Gaji')+' After '+esc(potLabel)+'</div>'
    +'<div class="eqrow"><span>Total gaji</span><span>'+fmt(c.total)+'</span></div>'
    +potRows
    +'<div class="eqdiv"></div>'
    +'<div class="eqrow tot"><span>Sisa</span><span class="num md '+(neg2?'dn':'')+'">'+fmt(c.afterPot)+'</span></div></div>'
    +split;
}
function vSalary(){
  $('#v-salary').innerHTML='<div class="seg">'
    +'<button class="'+(st.salTab==='tama'?'on':'')+'" onclick="A.salTab(\'tama\')">Gaji Tama</button>'
    +'<button class="'+(st.salTab==='septi'?'on':'')+'" onclick="A.salTab(\'septi\')">Gaji Septi</button></div>'
    +salPanel(st.salTab);
}
A.salTab=id=>{st.salTab=id;st.editComp=null;renderAll();};
A.lemb=(p,key,d)=>{
  const S=DB.salary[p];S[key]=Math.max(0,(S[key]||0)+d);
  save();renderAll();
  toast(d>0?'Lembur dicatet! ⏰':'Lembur dibatalin ↩️');
};
A.compEdit=id=>{st.editComp=id;renderAll();if(id){const i=document.querySelector('.srow.editing .inl');i&&i.focus();}};
A.compSave=(p,id)=>{
  const k=DB.salary[p].comp.find(x=>x.id===id);if(!k)return;
  const n=$('#ceN_'+id).value.trim(),a=parseNum($('#ceA_'+id).value);
  if(!n)return warnToast('Nama komponennya diisi ya');
  if(!a)return warnToast('Nominalnya diisi ya');
  k.name=n;k.amount=a;st.editComp=null;save();renderAll();toast('Komponen diperbarui ✨');
};
A.compAdd=p=>{
  const n=$('#cn_'+p).value.trim(),a=parseNum($('#ca_'+p).value);
  if(!n||!a)return warnToast('Isi nama & nominalnya dulu ya');
  DB.salary[p].comp.push({id:uid(),name:n,amount:a});
  save();renderAll();toast('Komponen gaji nambah! 📋');
};
A.compDel=(p,id)=>{
  const k=DB.salary[p].comp.find(x=>x.id===id);if(!k)return;
  askConfirm('Hapus komponen?','"'+esc(k.name)+'" buang dari daftar gaji?','Hapus',()=>{
    DB.salary[p].comp=DB.salary[p].comp.filter(x=>x.id!==id);
    save();renderAll();toast('Komponen dihapus 🗑️');
  });
};

/* ================= VIEW: TAGIHAN ================= */
function billRowHTML(p,b){
  if(st.editBill===b.id)return '<div class="srow editing">'
    +'<input class="inl" id="beN_'+b.id+'" value="'+esc(b.name)+'" placeholder="Nama tagihan">'
    +'<input class="inl" id="beA_'+b.id+'" inputmode="numeric" value="'+fmtP(b.amount)+'" oninput="A.fmtAmt(this)">'
    +'<button class="mini ok" onclick="A.billSave(\''+p+'\',\''+b.id+'\')">✓</button>'
    +'<button class="mini" onclick="A.billEdit(null)">✕</button></div>';
  return '<div class="srow">'
    +'<button class="chk '+(b.paid?'on':'')+'" onclick="A.billToggle(\''+p+'\',\''+b.id+'\')">'+(b.paid?'✅':'⭕')+'</button>'
    +'<div class="smid"><b class="'+(b.paid?'strike':'')+'">'+esc(b.name)+'</b><small>'+(b.paid?'Udah lunas, yeay!':'Belum dibayar')+'</small></div>'
    +'<div class="num sm">'+fmt(b.amount)+'</div>'
    +'<button class="mini" onclick="A.billEdit(\''+b.id+'\')">✏️</button>'
    +'<button class="mini danger" onclick="A.billDel(\''+p+'\',\''+b.id+'\')">🗑️</button></div>';
}
function billPanel(p){
  const P=p==='tama'?'Tama':'Septi',arr=DB.bills[p];
  const sum=arr.reduce((a,b)=>a+b.amount,0);
  const paidArr=arr.filter(b=>b.paid);
  const paidSum=paidArr.reduce((a,b)=>a+b.amount,0);
  const pct=sum?Math.round(paidSum/sum*100):0;
  return '<div class="card eqcard"><span class="tape"></span>'
    +'<div class="eqlab">🧾 Tagihan '+P+'</div>'
    +'<div class="billprog"><div class="hbar"><i style="width:'+pct+'%;background:#58BE93"></i></div>'
    +'<div class="eqnote">'+paidArr.length+'/'+arr.length+' lunas · '+fmt(paidSum)+' dari '+fmt(sum)+'</div></div>'
    +(arr.length?arr.map(b=>billRowHTML(p,b)).join(''):'<p class="emptyline">Belum ada tagihan. Tambahin di bawah ya!</p>')
    +'<div class="addrow"><input class="inl" id="bn_'+p+'" placeholder="Nama tagihan">'
    +'<input class="inl" id="ba_'+p+'" inputmode="numeric" placeholder="Nominal" oninput="A.fmtAmt(this)">'
    +'<button class="mini ok" onclick="A.billAdd(\''+p+'\')">＋</button></div></div>';
}
function vBills(){
  $('#v-bills').innerHTML='<div class="seg">'
    +'<button class="'+(st.billTab==='tama'?'on':'')+'" onclick="A.billTab(\'tama\')">Tagihan Tama</button>'
    +'<button class="'+(st.billTab==='septi'?'on':'')+'" onclick="A.billTab(\'septi\')">Tagihan Septi</button></div>'
    +billPanel(st.billTab)
    +'<p class="eqnote" style="text-align:center;margin-top:14px">Total tagihan di sini dipakai buat hitung "After Tagihan" di segmen Gaji ya 🐾</p>';
}
A.billTab=id=>{st.billTab=id;st.editBill=null;renderAll();};
A.billToggle=(p,id)=>{
  const b=DB.bills[p].find(x=>x.id===id);if(!b)return;
  b.paid=!b.paid;save();renderAll();
  if(b.paid){confetti(110);toast('"'+b.name+'" lunas! 🎉');}
  else toast('Status lunas dibatalin ↩️');
};
A.billEdit=id=>{st.editBill=id;renderAll();if(id){const i=document.querySelector('.srow.editing .inl');i&&i.focus();}};
A.billSave=(p,id)=>{
  const b=DB.bills[p].find(x=>x.id===id);if(!b)return;
  const n=$('#beN_'+id).value.trim(),a=parseNum($('#beA_'+id).value);
  if(!n)return warnToast('Nama tagihannya diisi ya');
  if(!a)return warnToast('Nominalnya diisi ya');
  b.name=n;b.amount=a;st.editBill=null;save();renderAll();toast('Tagihan diperbarui ✨');
};
A.billAdd=p=>{
  const n=$('#bn_'+p).value.trim(),a=parseNum($('#ba_'+p).value);
  if(!n||!a)return warnToast('Isi nama & nominal tagihannya dulu ya');
  DB.bills[p].push({id:uid(),name:n,amount:a,paid:false});
  save();renderAll();toast('Tagihan nambah! 🧾');
};
A.billDel=(p,id)=>{
  const b=DB.bills[p].find(x=>x.id===id);if(!b)return;
  askConfirm('Hapus tagihan?','"'+esc(b.name)+'" ('+fmt(b.amount)+') bakal dihapus dari daftar.','Hapus',()=>{
    DB.bills[p]=DB.bills[p].filter(x=>x.id!==id);
    save();renderAll();toast('Tagihan dihapus 🗑️');
  });
};

/* ================= VIEW: TARGET ================= */
function vTarget(){
  const el=$('#v-target');
  const list=mTx().filter(t=>t.type==='out');
  const spent={};list.forEach(t=>spent[t.cat]=(spent[t.cat]||0)+t.amount);
  let aman=0,bc=0,un=0;
  CATS_OUT.forEach(c=>{const t=DB.targets[c.n],sp=spent[c.n]||0;
    if(!t)un++;else if(sp>t)bc++;else aman++;});
  const mood=bc?'boncos':(un===CATS_OUT.length?'plain':'happy');
  const msg=un===CATS_OUT.length?'Isi target dulu biar Mochi bisa ngawasin boncos kamu!'
    :bc?'Aduh, '+bc+' kategori boncos bulan ini. Tahan dulu ya…'
    :'Semua kategori aman. Kamu hebat, irit banget! 🐾';
  const rows=CATS_OUT.map(c=>{
    const tg=DB.targets[c.n]||0,sp=spent[c.n]||0,over=tg&&sp>tg;
    const pct=tg?Math.min(100,sp/tg*100):(sp>0?100:0);
    const chip=!tg?'<span class="stchip st-none">BELUM ADA</span>'
      :over?'<span class="stchip st-boncos">BONCOS</span>'
      :'<span class="stchip st-aman">AMAN</span>';
    const sub=!tg?('Terpakai '+fmt(sp)+' bulan ini')
      :over?('Lewat '+fmt(sp-tg)+' dari target')
      :('Sisa '+fmt(tg-sp)+' dari '+fmt(tg));
    const barCol=over?'#E85B5B':(pct>75?'#F2A93B':c.c);
    const pill=st.editTgt===c.n
      ?'<input class="inl tged" id="tged" inputmode="numeric" value="'+(tg?fmtP(tg):'')+'" placeholder="0" oninput="A.fmtAmt(this)" onblur="A.tgtSave()" onkeydown="if(event.key===\'Enter\'){this.blur()}">'
      :'<button class="tgpill" data-n="'+esc(c.n)+'" onclick="A.tgtStart(this.dataset.n)">'+(tg?fmt(tg):'＋ Target')+'</button>';
    return '<div class="trow"><span class="tico" style="background:'+c.s+';border-color:'+c.c+'">'+c.e+'</span>'
      +'<div class="tmid"><div class="trowtop"><b>'+esc(c.n)+'</b>'+chip+'</div><small>'+sub+'</small>'
      +'<div class="hbar"><i style="width:'+pct+'%;background:'+barCol+'"></i></div></div>'+pill+'</div>';
  }).join('');
  el.innerHTML=
    '<div class="card hero thero"><span class="tape t2"></span><div>'
    +'<div class="hlab">Target bulan '+monthLabel()+'</div>'
    +'<div class="tmsg">'+msg+'</div>'
    +'<div class="hchips"><span class="hchip up">'+aman+' aman</span>'
    +'<span class="hchip dn">'+bc+' boncos</span>'
    +'<span class="hchip">'+un+' belum diset</span></div></div>'
    +'<div class="herocat" onclick="A.poke()">'+catSVG(mood,84)+'</div></div>'
    +'<div class="sechead"><span class="sdot"></span><h2>Target per kategori</h2><span class="cnt">pengeluaran bulan ini</span></div>'
    +'<div class="card" style="padding:6px 14px">'+rows+'</div>';
  if(st.editTgt)setTimeout(()=>{const i=$('#tged');i&&i.focus();},60);
}
A.tgtStart=n=>{st.editTgt=n;renderAll();};
A.tgtSave=()=>{
  const n=st.editTgt;if(!n)return;
  const inp=$('#tged'),v=inp?parseNum(inp.value):0;
  if(v>0){DB.targets[n]=v;toast('Target '+n+': '+fmt(v)+' / bulan 🎯');}
  else{delete DB.targets[n];}
  st.editTgt=null;save();renderAll();
};

/* ================= NAVIGASI ================= */
function setTab(t){
  st.tab=t;
  $$('.bnav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $$('main>section').forEach(s=>s.classList.toggle('on',s.id==='v-'+t));
}
A.tab=t=>{setTab(t);window.scrollTo({top:0});};
A.shift=d=>{
  st.m+=d;
  if(st.m<0){st.m=11;st.y--;}
  if(st.m>11){st.m=0;st.y++;}
  renderAll();
};
A.toNow=()=>{const n=new Date();st.y=n.getFullYear();st.m=n.getMonth();renderAll();};
function renderAll(){
  $('#mLab').textContent=monthLabel();
  vHome();vSummary();vSalary();vBills();vTarget();
  setTab(st.tab);
}

/* ================= KLIK DELEGASI ================= */
document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){
    const g=chip.parentElement;
    if(g){g.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));chip.classList.add('on');}
    if(chip.dataset.g==='from')A.prevCheck();
    return;
  }
  const cell=e.target.closest('.calcell[data-day]');
  if(cell){A.day(cell.dataset.day);return;}
  const pc=e.target.closest('[data-plat]');
  if(pc){A.plat(pc.dataset.plat);return;}
  const row=e.target.closest('.txrow[data-id]');
  if(row){A.txMenu(row.dataset.id);return;}
});

/* ================= PWA INSTALL ================= */
let deferredPrompt=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  if(standalone)return;
  const b=$('#pwaBanner');
  b.innerHTML=catSVG('happy',40)
    +'<div class="pb-t"><b>Pasang '+esc(CONFIG.NAMA_APP)+'!</b><small>Biar cepet diakses dari home screen HP kamu</small></div>'
    +'<button class="btn pink" id="pbGo">Install</button>'
    +'<button class="xbtn" id="pbX">✕</button>';
  b.hidden=false;
  $('#pbGo').onclick=A.install;
  $('#pbX').onclick=()=>{b.hidden=true;};
});
A.install=async()=>{
  if(!deferredPrompt)return toast('Buka menu browser → "Install app" / "Tambahkan ke Home" 📲');
  deferredPrompt.prompt();
  const r=await deferredPrompt.userChoice;
  deferredPrompt=null;$('#pwaBanner').hidden=true;
  if(r&&r.outcome==='accepted')toast('Mochi udah nempel di home screen! 🎉');
};
window.addEventListener('appinstalled',()=>{$('#pwaBanner').hidden=true;toast('Mochi udah nempel di home screen! 🎉');});

/* ================= INIT ================= */
loadData();
document.title=CONFIG.NAMA_APP+' · Tracker Keuangan';
 $('#brand').textContent='🐱 '+CONFIG.NAMA_APP;
renderAll();
syncFromServer();
</script>
